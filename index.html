<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA AI PREDICTION</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>ULTRA AI</h1>
    <p>COLOUR TRADING ANALYSIS SYSTEM</p>
</header>

<main>

    <section class="card">
        <h2>AI ANALYSIS DASHBOARD</h2>
        <p>Statistical analysis of previous game results.</p>

        <div class="status">
            SYSTEM STATUS: ONLINE
        </div>
    </section>

    <section class="card">
        <h2>GAME SELECTOR</h2>

        <button onclick="selectGame('30 Seconds')">
            WINGO 30 SEC
        </button>

        <button onclick="selectGame('1 Minute')">
            WINGO 1 MIN
        </button>
    </section>

    <section class="card">
        <h2>ANALYSIS RESULT</h2>
        <p id="game">Select a game period</p>
        <p id="result">Waiting for data...</p>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
